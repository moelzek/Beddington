# analyzers = ["state_change"]

[sounds]
# Record non-cry baby/room sounds the mic hears (cooing, laughter, snoring, etc.)
# as observer-only context for the night story. Off by default; the deterministic
# cry detection is unaffected.
enabled = false
threshold = 0.2

[soothe]
# Tier 1 is explicit. Keep this off unless you want Beddington to play the
# selected preset before notifying.
enabled = false
# "none" records the preset without playing audio. Use "auto" with sound_path
# for a real local audio file and a compatible system player.
player = "none"
# Pick exactly one preset listed below.
preset = "white_noise"
# Keep soothe audio playing for at least ten minutes once triggered.
min_play_seconds = 600.0
# Keep playing for ten minutes after the last cry ends.
hold_after_stop_seconds = 600.0
# Switch sounds after five minutes of continued crying.
escalate_after_seconds = 300.0

[soothe.learn]
# Use on-device outcome counts to choose a preset. On by default — learns which
# sound calms this baby; falls back to the configured preset until it has data.
enabled = true
min_samples = 10

[soothe.quiet_check]
# Quiet checks are deterministic listen-only windows during soothing. Keep this
# off until you are deliberately testing soothe verification.
enabled = false
check_interval_seconds = 120.0
listen_seconds = 5.0
required_checks = 2
pause_during_check = true
stop_on_notify = true

